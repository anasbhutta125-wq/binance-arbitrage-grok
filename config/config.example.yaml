# ============================================================
# Binance Funding Rate Arbitrage Bot - Configuration
# Copy this file to config.yaml and fill in your values
# ============================================================

exchange:
  name: binance
  testnet: true
  api_key: "YOUR_API_KEY"
  api_secret: "YOUR_API_SECRET"

strategy:
  symbols:
    - BTC/USDT:USDT
    - ETH/USDT:USDT
  min_funding_apr: 0.25
  max_basis_pct: 0.0015
  position_size_usdt: 100
  max_total_exposure_usdt: 500
  max_leverage: 2.0
  funding_lookback_hours: 8
  exit_funding_apr: 0.08
  rebalance_threshold_pct: 0.01
  min_hold_hours: 4
  round_trip_fee_pct: 0.0016
  expected_hold_hours: 24

risk:
  max_daily_loss_usdt: 30
  max_drawdown_pct: 0.05
  liquidation_buffer_pct: 0.20
  max_open_positions: 3
  emergency_flatten_on_error: true

execution:
  order_type: limit
  limit_offset_bps: 2
  max_slippage_bps: 10
  post_only: true
  retry_attempts: 3
  retry_delay_sec: 1.5

data:
  funding_update_interval_sec: 30
  account_update_interval_sec: 15
  orderbook_depth: 10

monitoring:
  log_level: INFO
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
  save_trades: true
  db_path: "data/trades.db"
  dashboard_host: "0.0.0.0"
  dashboard_port: 8080

runtime:
  dry_run: true
  check_interval_sec: 10
  heartbeat_interval_sec: 60
